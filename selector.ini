; ROG Select - configuration
; Edit paths here. Nothing is hardcoded in the app except the fallbacks
; below, which are only used when a value is left blank.
; Paths are relative to the folder containing rog-select.exe, or absolute.
; Restart ROG Select after editing this file.
;
; Sound mapping (user-supplied ElevenLabs files):
;   navigate = Gentle swoosh (menu moving)
;   select   = Brief metallic clang (selection / loading complete)
; If those two feel reversed on the device, swap the two lines below.
; No other file needs to change.

[General]
background=assets\background.png
sound_navigate=assets\navigate.mp3
sound_select=assets\select.mp3
; 0 = Windows, 1 = Emulation, 2 = Xbox, 3 = Steam. Hero default is Emulation.
default_focus=1
; sound=off to run silent. Anything else (or blank) plays sounds.
sound=on

[Windows]
label=Windows
image=assets\windows.png
; action=desktop means: close the selector and show the normal desktop.
; It does NOT replace Explorer and does NOT touch any shell registry value.
action=desktop

[Emulation]
label=Emulation
image=assets\emulation.png
action=exe
; *** SET THIS on the device ***
; Examples (delete the one you do not use, keep only one path line):
; path=C:\Users\ciara\AppData\Roaming\EmuDeck\ES-DE\ES-DE.exe
; path=C:\Program Files\Playnite\Playnite.FullscreenApp.exe
path=
arguments=
; Wait for this process name to exit before showing the selector again.
; Leave blank if your frontend's exe name is the launched exe itself
; (the app already waits on the launched process handle in that case).
return_process=

[Xbox]
label=Xbox
image=assets\xbox.png
; action=store_app launches the Xbox PC app by its AppUserModelID.
; If this fails on your device, run in PowerShell:
;   Get-StartApps | Where-Object { $_.Name -match 'Xbox' }
; and replace the path below with:
;   shell:AppsFolder\<the AUMID shown>
action=store_app
path=shell:AppsFolder\Microsoft.GamingApp_8wekyb3d8bbwe!Microsoft.Xbox.App
arguments=
return_process=GamingApp.exe

[Steam]
label=Steam
image=assets\steam.png
action=exe
; Leave path blank to auto-detect the usual Steam install locations.
; Or set it explicitly, e.g. path=C:\Program Files (x86)\Steam\steam.exe
path=
arguments=-bigpicture
; Selector returns when steam.exe exits. Note: closing Big Picture alone
; while Steam stays in the tray does NOT return to the selector yet -
; see README.md "Known limitations".
return_process=steam.exe
